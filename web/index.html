<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>daily</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --hover: #f5f5f4; --accent: #2563eb; --accent-fg: #fff;
  --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2; --warn: #a16207;
  --code-bg: #f5f5f4;
  --cm-kw: #7c3aed; --cm-type: #0e7490; --cm-str: #15803d; --cm-num: #c2410c; --cm-cmt: #a8a29e; --cm-meta: #be185d;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: Inter, ui-sans-serif, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0a09; --panel: #161412; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524;
    --hover: #1f1c1a; --accent: #60a5fa; --accent-fg: #0c0a09;
    --ok: #4ade80; --ok-bg: #052e16; --bad: #f87171; --bad-bg: #450a0a; --warn: #facc15;
    --code-bg: #1c1917;
    --cm-kw: #c4b5fd; --cm-type: #67e8f9; --cm-str: #86efac; --cm-num: #fdba74; --cm-cmt: #78716c; --cm-meta: #f9a8d4;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.primary:disabled { opacity: .6; cursor: progress; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.icon { padding: 5px 8px; border: none; }
kbd { font: 11px var(--mono); opacity: .7; margin-left: 4px; }

/* header */
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
header .brand { font: 600 16px var(--mono); letter-spacing: -.02em; }
header .title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .title small { color: var(--muted); font-weight: 400; font-family: var(--mono); margin-right: 6px; }
header .spacer { flex: 1; }
header .count { color: var(--muted); font: 12px var(--mono); }
.badge { font: 600 11px var(--mono); padding: 2px 7px; border-radius: 99px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }

/* layout */
.app { flex: 1; display: flex; min-height: 0; }
nav { width: 250px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
nav a { display: flex; align-items: center; gap: 8px; padding: 6px 14px; color: inherit; text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--hover); }
nav a.active { background: var(--hover); box-shadow: inset 3px 0 var(--accent); }
nav a .n { font: 11px var(--mono); color: var(--muted); width: 18px; }
nav a .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav a .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; }
nav a .dot.started { border-color: var(--warn); }
nav a .dot.passed { background: var(--ok); border-color: var(--ok); }
nav a .today { font: 10px var(--mono); color: var(--accent); }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); min-width: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.statement { overflow-y: auto; padding: 22px 28px 60px; border-right: 1px solid var(--line); }
.statement h1 { font-size: 20px; margin: 0 0 12px; letter-spacing: -.01em; }
.statement h2 { font-size: 16px; margin: 22px 0 8px; }
.statement code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.statement pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
.statement pre code { background: none; padding: 0; }
.statement table { border-collapse: collapse; } .statement td, .statement th { border: 1px solid var(--line); padding: 4px 8px; }

.toolbar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { border: none; border-radius: 0; padding: 5px 11px; }
.tabs button.on { background: var(--hover); font-weight: 600; }
.toolbar .status { color: var(--muted); font-size: 12px; margin-left: auto; }
.editor { flex: 1; min-height: 0; position: relative; }
.CodeMirror { position: absolute; inset: 0; height: auto; font: 13px/1.6 var(--mono); background: var(--panel); color: var(--fg); }
.CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left-color: var(--fg); }
.cm-fat-cursor .CodeMirror-cursor { background: var(--accent); opacity: .5; }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; }
.CodeMirror-matchingbracket { color: var(--accent) !important; outline: 1px solid var(--accent); }
.cm-keyword { color: var(--cm-kw); } .cm-type, .cm-variable-3 { color: var(--cm-type); } .cm-builtin { color: var(--cm-type); }
.cm-string { color: var(--cm-str); } .cm-number { color: var(--cm-num); } .cm-comment { color: var(--cm-cmt); font-style: italic; }
.cm-meta { color: var(--cm-meta); } .cm-def { color: var(--fg); font-weight: 600; } .cm-atom { color: var(--cm-num); }
.cm-variable, .cm-variable-2, .cm-operator, .cm-property { color: var(--fg); }
.line-error { background: var(--bad-bg); } .line-warning { background: color-mix(in srgb, var(--warn) 15%, transparent); }

.output { height: 36%; min-height: 90px; border-top: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
.output .head { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.output .result { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 99px; }
.output .result.ok { background: var(--ok-bg); color: var(--ok); } .output .result.bad { background: var(--bad-bg); color: var(--bad); }
.output pre { flex: 1; margin: 0; overflow: auto; padding: 8px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
.output .l-ok { color: var(--ok); } .output .l-bad { color: var(--bad); } .output .l-warn { color: var(--warn); }
.output .l-dim { color: var(--muted); } .output .jump { cursor: pointer; text-decoration: underline dotted; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.overlay.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(900px, 100%); height: min(80vh, 800px); display: flex; flex-direction: column; overflow: hidden; }
.modal .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal .body { flex: 1; position: relative; }

.mobile-tabs { display: none; }
@media (max-width: 900px) {
  nav { position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: 280px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  nav.open { transform: none; }
  main { display: block; position: relative; }
  main > .pane { position: absolute; inset: 0; display: none; }
  main[data-view="problem"] > .statement, main[data-view="code"] > .code { display: flex; }
  .statement { display: block !important; padding: 18px 16px 60px; border: none; }
  main[data-view="code"] > .statement { display: none !important; }
  .mobile-tabs { display: flex; }
  header .count, header .brand { display: none; }
  .hide-sm { display: none; }
}
@media (min-width: 901px) { #menu { display: none; } }
</style>
</head>
<body>
<header>
  <button class="icon" id="menu" aria-label="Exercises">☰</button>
  <span class="brand">daily</span>
  <span class="title" id="title"></span>
  <span class="badge ok" id="passed" hidden></span>
  <span class="spacer"></span>
  <div class="tabs mobile-tabs"><button data-view="problem">Problem</button><button data-view="code" class="on">Code</button></div>
  <span class="count" id="count"></span>
  <form method="post" action="/logout" style="margin:0"><button class="icon hide-sm" title="Sign out">⎋</button></form>
</header>
<div class="app">
  <nav id="nav"></nav>
  <main id="main" data-view="code">
    <div class="pane statement" id="statement"></div>
    <div class="pane code">
      <div class="toolbar">
        <div class="tabs" id="filetabs">
          <button data-file="code" class="on">Solution</button>
          <button data-file="sample">Sample</button>
        </div>
        <button class="primary" id="run">Run tests<kbd class="hide-sm">⌘↵</kbd></button>
        <button id="reset">Reset</button>
        <button id="ref">Reference</button>
        <button id="vim" title="Toggle Vim keybindings">Vim</button>
        <span class="status" id="status"></span>
      </div>
      <div class="editor" id="editor"></div>
      <div class="output">
        <div class="head"><span>Output</span><span class="result" id="result" hidden></span></div>
        <pre id="out"><span class="l-dim">Run tests with the button or Ctrl/⌘+Enter.
Solution runs the full test suite (a pass is recorded); Sample runs your own cases.</span></pre>
      </div>
    </div>
  </main>
</div>
<div class="overlay" id="refbox">
  <div class="modal">
    <div class="head"><span id="reftitle">Reference solution</span><span class="spacer" style="flex:1"></span><button id="refclose">Close</button></div>
    <div class="body" id="refeditor"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/vim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let list = null;      // /api/exercises payload
let ex = null;        // current exercise payload
let file = "code";    // "code" | "sample"
let docs = {};        // file -> CodeMirror.Doc
let dirty = {};       // file -> unsaved?
let saveTimer = null;
let running = false;
let marks = [];

const cm = CodeMirror($("#editor"), {
  mode: "text/x-c++src", lineNumbers: true, indentUnit: 2, tabSize: 2,
  matchBrackets: true, autoCloseBrackets: true,
  keyMap: store.get("daily.vim", "0") === "1" ? "vim" : "default",
  extraKeys: {
    "Ctrl-Enter": () => run(), "Cmd-Enter": () => run(),
    "Ctrl-S": () => save(), "Cmd-S": () => save(),
  },
});
CodeMirror.Vim && CodeMirror.Vim.defineEx("write", "w", () => save());
const refcm = CodeMirror($("#refeditor"), { mode: "text/x-c++src", lineNumbers: true, readOnly: true });

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.reload(); throw new Error("signed out"); }
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r;
}

function setStatus(s) { $("#status").textContent = s; }

// ---- exercise list ----------------------------------------------------
async function loadList() {
  list = await (await api("/api/exercises")).json();
  const done = list.exercises.filter((e) => e.passed).length;
  $("#count").textContent = `${done}/${list.exercises.length} passed`;
  $("#nav").innerHTML = list.exercises.map((e) => `
    <a href="#${e.id}" data-id="${e.id}" class="${ex && ex.id === e.id ? "active" : ""}"
       title="${e.passed ? "passed " + e.passed : e.started ? "started" : "not started"}">
      <span class="dot ${e.passed ? "passed" : e.started ? "started" : ""}"></span>
      <span class="n">${e.id.slice(0, 2)}</span>
      <span class="t">${escapeHtml(e.title)}</span>
      ${e.id === list.today ? '<span class="today">today</span>' : ""}
    </a>`).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// ---- open an exercise -------------------------------------------------
async function open(id) {
  await flush();
  ex = await (await api(`/api/ex/${id}`)).json();
  docs = {
    code: CodeMirror.Doc(ex.code, "text/x-c++src"),
    sample: CodeMirror.Doc(ex.sample, "text/x-c++src"),
  };
  dirty = {};
  for (const f of ["code", "sample"]) docs[f].on("change", () => { dirty[f] = true; scheduleSave(); });
  switchFile("code");
  $("#title").innerHTML = `<small>${ex.id.slice(0, 2)}</small>${escapeHtml(ex.title)}`;
  $("#statement").innerHTML = DOMPurify.sanitize(marked.parse(ex.readme));
  $("#statement").scrollTop = 0;
  showPassed(ex.passed);
  $("#out").innerHTML = '<span class="l-dim">Ctrl/⌘+Enter to run the tests.</span>';
  $("#result").hidden = true;
  document.title = `${ex.id} · daily`;
  store.set("daily.last", ex.id);
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("active", a.dataset.id === id));
  $("#nav").classList.remove("open");
  setStatus("");
}

function showPassed(date) {
  $("#passed").hidden = !date;
  $("#passed").textContent = date ? `✓ ${date}` : "";
}

function switchFile(f) {
  file = f;
  cm.swapDoc(docs[f]);
  clearMarks();
  document.querySelectorAll("#filetabs button").forEach((b) => b.classList.toggle("on", b.dataset.file === f));
  $("#run").firstChild.textContent = f === "code" ? "Run tests" : "Run sample";
  cm.focus();
}

// ---- saving -----------------------------------------------------------
function scheduleSave() {
  setStatus("editing…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 800);
}

async function save() {
  clearTimeout(saveTimer);
  if (!ex) return;
  const id = ex.id;
  const pending = Object.keys(dirty).filter((f) => dirty[f]);
  for (const f of pending) {
    dirty[f] = false;
    const text = docs[f].getValue();
    try {
      await api(`/api/ex/${id}/${f}`, { method: "PUT", body: text });
    } catch (e) { dirty[f] = true; setStatus("save failed — retrying"); scheduleSave(); return; }
  }
  if (pending.length) setStatus("saved");
}
const flush = save;
window.addEventListener("beforeunload", (e) => { if (Object.values(dirty).some(Boolean)) e.preventDefault(); });

// ---- running ----------------------------------------------------------
async function run() {
  if (running || !ex) return;
  running = true;
  clearTimeout(saveTimer);
  const id = ex.id, which = file;
  const src = docs[which].getValue();
  dirty[which] = false;  // the run request saves it
  $("#run").disabled = true;
  $("#result").hidden = true;
  $("#out").innerHTML = "";
  clearMarks();
  setStatus("compiling…");
  let text = "";
  try {
    const r = await api(`/api/ex/${id}/${which === "code" ? "test" : "sample"}`, { method: "POST", body: src });
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      text += dec.decode(value, { stream: true });
      if (/^\s{2}\S/m.test(text)) setStatus("running…");
      renderOutput(text, id, which);
    }
  } catch (e) {
    text += `\n${e.message}\nFAILED\n`;
    renderOutput(text, id, which);
  }
  running = false;
  $("#run").disabled = false;
  setStatus("");
  const last = text.trim().split("\n").pop();
  const ok = last === "PASSED";
  $("#result").hidden = false;
  $("#result").className = "result " + (ok ? "ok" : "bad");
  $("#result").textContent = ok ? "PASSED" : last === "COMPILE ERROR" ? "COMPILE ERROR" : "FAILED";
  if (ex && ex.id === id) markErrors(text, id, which);
  if (ok && which === "code") {
    await loadList();
    showPassed(list.exercises.find((e) => e.id === id)?.passed);
  }
}

function locRe(id, which) {
  const name = id + (which === "sample" ? ".sample" : "") + ".cpp";
  return new RegExp(name.replace(/\./g, "\\.") + ":(\\d+):(?:(\\d+):)? (error|warning|note|runtime error)?");
}

function renderOutput(text, id, which) {
  const re = locRe(id, which);
  const pre = $("#out");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
  pre.innerHTML = text.split("\n").map((line) => {
    let cls = "";
    if (/^\s{2}\S.*\bok\s+\(\d+ ms\)$/.test(line) || line === "PASSED") cls = "l-ok";
    else if (/\bFAIL\b|FAILED|COMPILE ERROR|TIMEOUT|error:|ERROR: AddressSanitizer|runtime error|KILLED/.test(line)) cls = "l-bad";
    else if (/warning:/.test(line)) cls = "l-warn";
    else if (/^== |^\s+\d+ tests,/.test(line) || /note:/.test(line)) cls = "l-dim";
    const m = line.match(re);
    const attrs = m ? ` class="${cls} jump" data-line="${m[1]}" data-col="${m[2] || 1}"` : cls ? ` class="${cls}"` : "";
    return `<span${attrs}>${escapeHtml(line)}</span>`;
  }).join("\n");
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

function clearMarks() { marks.forEach((m) => cm.removeLineClass(m, "background")); marks = []; }

function markErrors(text, id, which) {
  if (file !== which) return;
  const re = locRe(id, which);
  for (const line of text.split("\n")) {
    const m = line.match(re);
    if (!m || !m[3] || m[3] === "note") continue;
    const h = cm.addLineClass(+m[1] - 1, "background", m[3] === "warning" ? "line-warning" : "line-error");
    if (h) marks.push(h);
  }
}

$("#out").addEventListener("click", (e) => {
  const t = e.target.closest(".jump");
  if (!t) return;
  $("#main").dataset.view = "code";
  cm.focus();
  cm.setCursor({ line: +t.dataset.line - 1, ch: +t.dataset.col - 1 });
  cm.scrollIntoView(null, 100);
});

// ---- buttons ----------------------------------------------------------
$("#run").onclick = run;
$("#filetabs").onclick = (e) => { const b = e.target.closest("button"); if (b) switchFile(b.dataset.file); };

// two-step confirm without a blocking dialog
function armed(btn, label, action) {
  const orig = btn.textContent;
  btn.onclick = async () => {
    if (btn.dataset.armed) {
      clearTimeout(+btn.dataset.armed); delete btn.dataset.armed;
      btn.textContent = orig; btn.classList.remove("danger");
      await action();
    } else {
      btn.textContent = label; btn.classList.add("danger");
      btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.textContent = orig; btn.classList.remove("danger"); }, 3000);
    }
  };
}
armed($("#reset"), "Reset to skeleton?", async () => {
  const { code } = await (await api(`/api/ex/${ex.id}/reset`, { method: "POST" })).json();
  docs.code.setValue(code); dirty.code = false;
  switchFile("code"); setStatus("reset to skeleton"); loadList();
});
armed($("#ref"), "Show the answer?", async () => {
  const { code } = await (await api(`/api/ex/${ex.id}/reference`)).json();
  $("#reftitle").textContent = `Reference — ${ex.id}`;
  $("#refbox").classList.add("open");
  refcm.setValue(code || "// no reference solution"); refcm.refresh();
});
$("#refclose").onclick = () => $("#refbox").classList.remove("open");
$("#refbox").onclick = (e) => { if (e.target.id === "refbox") $("#refbox").classList.remove("open"); };

function paintVim() { $("#vim").classList.toggle("on", cm.getOption("keyMap") === "vim"); $("#vim").style.fontWeight = cm.getOption("keyMap") === "vim" ? 600 : ""; }
$("#vim").onclick = () => {
  const on = cm.getOption("keyMap") !== "vim";
  cm.setOption("keyMap", on ? "vim" : "default");
  store.set("daily.vim", on ? "1" : "0");
  paintVim(); cm.focus();
};
paintVim();

$("#menu").onclick = () => $("#nav").classList.toggle("open");
document.querySelectorAll(".mobile-tabs button").forEach((b) => b.onclick = () => {
  $("#main").dataset.view = b.dataset.view;
  document.querySelectorAll(".mobile-tabs button").forEach((x) => x.classList.toggle("on", x === b));
  if (b.dataset.view === "code") cm.refresh();
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if (e.key === "Escape") $("#refbox").classList.remove("open");
});

window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && (!ex || id !== ex.id)) open(id); });

(async () => {
  await loadList();
  const ids = new Set(list.exercises.map((e) => e.id));
  const want = [location.hash.slice(1), store.get("daily.last", ""), list.next, list.today].find((i) => ids.has(i));
  if (location.hash.slice(1) !== want) history.replaceState(null, "", "#" + want);
  await open(want);
})();
</script>
